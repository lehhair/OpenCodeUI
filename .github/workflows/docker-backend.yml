name: Build & Push Backend Docker Image

on:
  push:
    branches: [main, dev]
    paths:
      - 'docker/Dockerfile.backend'
      - 'docker/backend-entrypoint.sh'
      - 'docker/opencode-release.sh'
      - 'docker/resolve-opencode-release.sh'
      - '.github/workflows/docker-backend.yml'
  schedule:
    # 每天自动重建，跟进 opencode 最新版本
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencodeui-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只读取一次 latest，将版本、各架构下载地址和摘要一起固定。
      # 清单进入 build-arg，既避免构建时再次读取 latest 的竞态，也使缓存随之更新。
      - name: Resolve OpenCode release
        id: opencode
        run: bash docker/resolve-opencode-release.sh >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCODE_VERSION=${{ steps.opencode.outputs.version }}
            OPENCODE_MANIFEST_BASE64=${{ steps.opencode.outputs.manifest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
