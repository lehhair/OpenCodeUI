name: Build & Push Backend Docker Image

on:
  push:
    branches: [main, dev]
    paths:
      - 'docker/Dockerfile.backend'
      - 'docker/backend-entrypoint.sh'
      - '.github/workflows/docker-backend.yml'
  schedule:
    # 每天自动重建，跟进 opencode 最新版本
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencodeui-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本号进 build-arg，既能锁住本次构建装的是哪个 opencode，
      # 也让 BuildKit 在发新版时丢掉旧的二进制层（否则层缓存会一直
      # 复用第一次装的那版，日志看着每天重组，实际纹丝不动）。
      - name: Resolve OpenCode version
        id: opencode
        run: |
          version="$(curl -fsSL --retry 3 --retry-delay 2 \
            https://opencode.ai/update/api/latest/cli/opencode | jq -r '.version')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "OpenCode $version"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCODE_VERSION=${{ steps.opencode.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
